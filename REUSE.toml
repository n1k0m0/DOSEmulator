# Data formats cannot contain source comments. This annotation covers original
# project profiles and the hand-drawn font data; external media are not included.
[[annotations]]
path = ["profiles/*.json", "docs/state-schema-v1.json", "docs/state-events-v1.json", "firmware/fonts/*.txt", "src/SharpPixels/Properties/Resources.resx"]
